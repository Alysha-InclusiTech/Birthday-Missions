<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Birthday Missions</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Auth screen -->
    <section id="auth-screen" class="screen">
      <div class="auth-card">
        <h1>🎉 Birthday Missions</h1>
        <p class="subtitle">27 missions. 5 tags. One legendary birthday.</p>

        <div class="auth-tabs">
          <button id="tab-login" class="auth-tab active">Log In</button>
          <button id="tab-register" class="auth-tab">Register</button>
        </div>

        <form id="login-form" class="auth-form">
          <label>Username<input type="text" id="login-username" required autocomplete="username" /></label>
          <label>Password<input type="password" id="login-password" required autocomplete="current-password" /></label>
          <button type="submit">Log In</button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <label>Username<input type="text" id="register-username" required autocomplete="username" /></label>
          <label>Password<input type="password" id="register-password" required autocomplete="new-password" /></label>
          <button type="submit">Create Account</button>
        </form>

        <p id="auth-error" class="error hidden"></p>
      </div>
    </section>

    <!-- Main app -->
    <section id="main-screen" class="screen hidden">
      <header class="topbar">
        <div class="brand">🎂 Birthday Missions</div>
        <nav class="tabs">
          <button id="nav-missions" class="nav-tab active">Missions</button>
          <button id="nav-leaderboard" class="nav-tab">Leaderboard</button>
        </nav>
        <div class="user-box">
          <span id="whoami"></span>
          <button id="logout-btn" class="ghost-btn">Log Out</button>
        </div>
      </header>

      <div id="missions-view" class="view">
        <div class="progress-bar-wrap">
          <div class="progress-label">
            <span id="progress-text">0 / 27 missions</span>
            <span id="progress-points">0 pts</span>
          </div>
          <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        </div>

        <div class="filter-row" id="filter-row">
          <button class="filter-chip active" data-tag="All">All</button>
          <button class="filter-chip tag-Easy-Mode" data-tag="Easy Mode">Easy Mode</button>
          <button class="filter-chip tag-Explorer" data-tag="Explorer">Explorer</button>
          <button class="filter-chip tag-Challenge" data-tag="Challenge">Challenge</button>
          <button class="filter-chip tag-Chaos" data-tag="Chaos">Chaos</button>
          <button class="filter-chip tag-Final-Boss" data-tag="Final Boss">Final Boss</button>
        </div>

        <div id="missions-grid" class="missions-grid"></div>
      </div>

      <div id="leaderboard-view" class="view hidden">
        <h2>🏆 Leaderboard</h2>
        <table class="leaderboard-table">
          <thead>
            <tr><th>Rank</th><th>Player</th><th>Missions</th><th>Points</th></tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Submit proof modal -->
  <div id="submit-modal" class="modal-overlay hidden">
    <div class="modal">
      <button id="modal-close" class="modal-close">&times;</button>
      <h3 id="modal-title"></h3>
      <p id="modal-description"></p>
      <p id="modal-points" class="modal-points"></p>
      <form id="submit-form">
        <label class="file-label">
          Upload photo or video proof
          <input type="file" id="proof-file" accept="image/*,video/*" required />
        </label>
        <div id="file-preview" class="file-preview hidden"></div>
        <div id="upload-progress-wrap" class="progress-track hidden"><div id="upload-progress-fill" class="progress-fill"></div></div>
        <button type="submit" id="submit-proof-btn">Submit Proof</button>
      </form>
      <p id="modal-error" class="error hidden"></p>
    </div>
  </div>

  <!-- View proof modal -->
  <div id="view-modal" class="modal-overlay hidden">
    <div class="modal">
      <button id="view-modal-close" class="modal-close">&times;</button>
      <h3 id="view-modal-title"></h3>
      <div id="view-modal-media"></div>
    </div>
  </div>

  <script src="/vendor/blob-client.js"></script>
  <script src="/app.js"></script>
</body>
</html>
